version: "3.7"

services:
  cars-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cars-api
    restart: unless-stopped
    init: true

    network_mode: host

    env_file:
      - .env

    command:
      - gunicorn
      - --bind
      - 127.0.0.0:5000
      - --workers
      - "1"
      - --threads
      - "1"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - dashboard_olx:app

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "none"